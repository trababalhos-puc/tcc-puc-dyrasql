name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/dyrasql-core/requirements.txt
            src/trino-gateway-proxy/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/dyrasql-core/requirements.txt
          pip install -r src/trino-gateway-proxy/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests with coverage
        run: |
          python -m pytest -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=90

  release:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=DyraSQL ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Sync project version check
        run: |
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" 2>/dev/null \
            || python3 -c "import re; t=open('pyproject.toml').read(); print(re.search(r'version\s*=\s*\"([^\"]+)\"', t).group(1))")
          if [ "$PY_VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::warning::pyproject.toml version ($PY_VERSION) differs from tag (${{ steps.meta.outputs.version }})"
          fi

      - name: Build release notes body
        run: |
          {
            echo "## DyraSQL ${{ steps.meta.outputs.tag }}"
            echo ""
            echo "Roteamento dinamico de consultas SQL (TCC PUC Minas)."
            echo ""
            echo "### Artefatos"
            echo "- Codigo-fonte em \`src/\`"
            echo "- Documentacao: https://trababalhos-puc.github.io/tcc-puc-dyrasql/"
            echo "- Changelog: ver CHANGELOG.md"
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "### Notas do CHANGELOG"
              echo ""
              # Extrai secao da versao atual (entre ## [x.y.z] e proximo ##)
              awk -v ver="${{ steps.meta.outputs.version }}" '
                $0 ~ "^## \\[" ver "\\]" {p=1; next}
                p && $0 ~ /^## \[/ {exit}
                p {print}
              ' CHANGELOG.md
            fi
          } > release-body.md
          cat release-body.md

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp LICENSE release-assets/LICENSE
          cp CHANGELOG.md release-assets/CHANGELOG.md
          if [ -f docs/principal.pdf ]; then
            cp docs/principal.pdf release-assets/principal.pdf
          fi
          if ls docs/TCC_*.pdf >/dev/null 2>&1; then
            cp docs/TCC_*.pdf release-assets/tcc-monografia.pdf
          fi
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.title }}
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
