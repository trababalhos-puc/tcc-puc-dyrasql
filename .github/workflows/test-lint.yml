name: Test and Lint

on:
  push:
    branches: [developer, main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "src/dyrasql-core/requirements.txt"
      - "src/trino-gateway-proxy/requirements.txt"
      - ".github/workflows/test-lint.yml"
  pull_request:
    branches: [developer, main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "src/dyrasql-core/requirements.txt"
      - "src/trino-gateway-proxy/requirements.txt"
      - ".github/workflows/test-lint.yml"
  workflow_dispatch:

concurrency:
  group: test-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

  test:
    name: Pytest with coverage >= 90%
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/dyrasql-core/requirements.txt
            src/trino-gateway-proxy/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/dyrasql-core/requirements.txt
          pip install -r src/trino-gateway-proxy/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          python -m pytest -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
