name: Release Drafter

on:
  push:
    branches: [main, developer]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Update draft release
        uses: release-drafter/release-drafter@v7
        with:
          # Config sempre na default branch (main); v7 usa Node 24
          config-name: release-drafter.yml@${{ github.event.repository.default_branch }}
          commitish: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
