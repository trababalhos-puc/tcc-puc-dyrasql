[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath =
    src/dyrasql-core
    src/scripts
    src/trino-gateway
addopts =
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=90
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
branch = False
source = src
omit =
    */tests/*
    src/**/__pycache__/*

[coverage:report]
fail_under = 90
show_missing = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
