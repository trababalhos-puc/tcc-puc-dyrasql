<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="white"/>
  <text x="600" y="36" text-anchor="middle" font-family="Helvetica, Arial" font-size="22" fill="#111">Contexto do Sistema</text>
  <ellipse cx="160" cy="220" rx="90" ry="55" fill="#08427b"/>
  <text x="160" y="214" text-anchor="middle" font-family="Helvetica, Arial" font-size="14" fill="white">Analista de dados</text>
  <text x="160" y="234" text-anchor="middle" font-family="Helvetica, Arial" font-size="12" fill="white">[Person]</text>
  <rect x="390" y="150" rx="18" width="280" height="140" fill="#1168bd"/>
  <text x="530" y="204" text-anchor="middle" font-family="Helvetica, Arial" font-size="18" fill="white">DyraSQL</text>
  <text x="530" y="228" text-anchor="middle" font-family="Helvetica, Arial" font-size="12" fill="white">Roteamento dinamico</text>
  <text x="530" y="248" text-anchor="middle" font-family="Helvetica, Arial" font-size="12" fill="white">baseado em metadados Iceberg</text>
  <rect x="820" y="150" rx="18" width="300" height="140" fill="#1168bd"/>
  <text x="970" y="204" text-anchor="middle" font-family="Helvetica, Arial" font-size="18" fill="white">Ambiente local</text>
  <text x="970" y="228" text-anchor="middle" font-family="Helvetica, Arial" font-size="12" fill="white">Trino, MinIO, PostgreSQL</text>
  <text x="970" y="248" text-anchor="middle" font-family="Helvetica, Arial" font-size="12" fill="white">e catalogo Iceberg</text>
  <line x1="250" y1="220" x2="390" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="208" text-anchor="middle" font-family="Helvetica, Arial" font-size="12" fill="#444">Consultas SQL</text>
  <line x1="670" y1="220" x2="820" y2="220" stroke="#555" stroke-width="2"/>
  <text x="745" y="208" text-anchor="middle" font-family="Helvetica, Arial" font-size="12" fill="#444">Clusters e data lake</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
