version: '3.8'

services:
  latex:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcc-latex:latest
    container_name: tcc-compiler
    volumes:
      # Monta o diretório atual no container
      - .:/tcc
      # Mantém cache de pacotes LaTeX para compilações mais rápidas
      - latex-cache:/root/.texlive
    working_dir: /tcc
    # Comando padrão pode ser sobrescrito
    command: make compile
    # Remove o container após execução
    # Para debug, comente esta linha
    # stdin_open: true
    # tty: true

volumes:
  latex-cache:
    driver: local
